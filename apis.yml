aid: hashboard
name: Hashboard
description: >-
  Hashboard is a business intelligence (BI) platform built around a BI-as-code
  workflow: data teams define their semantic layer, metrics, explorations, and
  dashboards as version-controlled configuration files and manage them with the
  Hashboard CLI (hb) and the hashquery Python framework. Changes are previewed,
  code-reviewed, and deployed through CI/CD pipelines (GitHub Actions, dbt Cloud),
  while the hosted app provides interactive dashboards, metric pages, and
  self-serve data exploration on top of the customer's own cloud data warehouse
  (query-based, with no full data ingestion into Hashboard infrastructure).
  Hashboard is SOC 2 Type II certified and supports HIPAA compliance with BAAs.
  Hashboard was acquired by Hex Technologies.
